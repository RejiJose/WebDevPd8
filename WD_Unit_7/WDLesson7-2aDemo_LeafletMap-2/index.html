<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>WD 7.2b Demo (Leaflet Map) </title>    
    <!-- CSS and JS required for LeafletJS maps -->
    <!-- LeafletJS CSS file -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- LeafletJS JS file (must be after Leaflet's CSS file) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="helper.js"></script> 
    <script src="script.js"></script>    
  </head>
  
  <body>
    <div id="banner" class="container center">
      <h1> LeafletJS Map</h1>
    </div>
    <div class="container subbanner">
      <div>
        <p>This example demonstrates how to retrieve a static map from <a href="https://leafletjs.com/examples/quick-start/" target="_blank">LeafletJS Map</a> using latitude and longitude as location identifier. LeafletJS involves a RESTful API. However, there are some CSS and JS files that must be linked.</p>
       </div>
    </div>
    <div class="container">
      <input style="flex:1;text-align:right;" type="text" id="lat" placeholder="Enter Latitude" value="50"> &nbsp; 
      <input style="flex:1;text-align:right;" type="text" id="lon" placeholder="Enter Longitude" value="2"> &nbsp;
      <input style="flex:1;text-align:right;" type="text" id="address" placeholder="Enter Address"> &nbsp;
      <a class="button" onclick="displayLocation()"> View </a>
    </div>

    <div id="map"></div>
    
    <div id="footer" class="container center">
      <h3>Lesson 7-2b Demonstration</h3>
    </div>  
  </body>
</html>
