<!DOCTYPE html>
<!-- WD Lesson 3.1: 
     How can we add interactions to a web page? -->

<!-- Resources 
     https://www.w3schools.com/js/default.asp
-->
<html>
  <head> 
    <title>WD_3.1 Demo</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <style>
      /* CSS: Create a class "clickable" so that when the user hovers over an element of that class, the cursor changes to a pointer(hand) */
      .clickable{
        cursor:pointer;
      }
    </style>
    <script src="script.js"></script>
  </head>

  <!-- Example 4: Display "Welcome!" when the page loads. -->
  <body onload="alert('Welcome')">

    <div id="banner" class="container center">
      <h1>Event Listener</h1>
    </div>

    <div id="content">
        <!-- Example 1: Display "Hello World" when the user clicks on the heading -->
        <h1 class="clickable" onclick="alert('Hello World')"> Click Me </h1>
        <!-- Event listener: represents the program listening to see if an action(the event) has occured -->

        <!-- Example 2: Display "Who is there?" when the user moves their mouse over the words, "Knock knock". -->
        <span onmouseover="alert('Who is there?')"> Knock knock </span>
        <br><br>
        
        <!-- Example 3: Display "Machine Learning" when the user double-clicks their mouse on the image. Make the image belong to the 'clickable' class -->
        <img src="ML.jpg" height="200px" class="clickable" ondblclick="alert('Machine Learning')"><br>
    </div>

  </body>
</html>
